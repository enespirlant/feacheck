# Rover pilotu girdi formu — "?" olan yerleri doldur, dosyayı bana gönder.
# Birimler parantez içinde. Varsayım satırlarını değiştirmezsen önerilen değer kullanılır.

parca:
  step_dosyasi: ?            # ör. C:\Users\pirla\feacheck\parts\teker_baglanti.step
  ne_parcasi: ?              # ör. "teker motor braketi", "süspansiyon kolu"
  malzeme: ?                 # ör. "Al 6061-T6", "S235"
  baglanti: ?                # şasiye nasıl bağlı: "2 adet M6 cıvata", "kaynak", "pim" ...
  yuk_nereden: ?             # yük parçaya nereden giriyor: "aks deliği", "motor flanşı" ...

arac:
  kutle: ?                   # (kg) tüm araç, yük dahil
  teker_sayisi: ?            # (adet)
  teker_capi: ?              # (mm)
  motor_torku: ?             # (N·m) motor çıkışı, tepe değer
  disli_orani: 1             # motor → teker (redüktör yoksa 1)
  verim: 0.9                 # dişli verimi (yoksa 1)

varsayimlar:                 # emin değilsen dokunma
  k_dyn: 2.5                 # engel/çukur darbe katsayısı (2–3 tipik)
  mu: 0.8                    # çekiş sürtünmesi (toprak/kaya)
  mu_lat: 0.5                # yanal kayma sürtünmesi
